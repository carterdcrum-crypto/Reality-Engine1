name: Build & Release Android APK

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs with Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          gradle assembleRelease --stacktrace --no-daemon || true

      - name: Prepare APK Release Files
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngine-APK-Installers
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "Reality Engine APK - Release #${{ github.run_number }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
